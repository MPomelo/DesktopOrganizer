name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build installer
        shell: pwsh
        run: .\scripts\Build-Release.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DesktopOrganizer-Windows-x64
          path: artifacts/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            artifacts/release/DesktopOrganizer-Setup-1.0.0-x64.exe `
            artifacts/release/DesktopOrganizer-1.0.0-win-x64-portable.exe `
            artifacts/release/SHA256SUMS.txt `
            artifacts/release/USER_GUIDE.md `
            --title "DesktopOrganizer $tag" `
            --generate-notes
